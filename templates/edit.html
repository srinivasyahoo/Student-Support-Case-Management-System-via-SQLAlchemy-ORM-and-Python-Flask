{% extends 'base.html' %}

{% block content %}
    <h1 style="width: 100%">
        {% block title %} Edit Support Request #{{ support_request.id }} for {{ support_request.student_name }} {% endblock %}
    </h1>
    <form method="post">
        <p>
            <label for="student_id">Student ID</label><br>
            <input type="text" name="student_id"
                   value="{{ support_request.student_id }}"
                   placeholder="Unique Identifier" required>
        </p>

        <p>
            <label for="student_name">Student Name</label><br>
            <input type="text" name="student_name"
                   value="{{ support_request.student_name }}"
                   placeholder="Full student name" required>
        </p>

        <p>
            <label for="course">Course</label><br>
            <input type="text" name="course"
                   value="{{ support_request.course }}"
                   placeholder="Program of study" required>
        </p>

        <p>
            <label for="support_category">Support Category</label><br>
            <select name="support_category" required>
                <option value="Academic" {% if support_request.support_category == 'Academic' %}selected{% endif %}>Academic</option>
                <option value="Financial" {% if support_request.support_category == 'Financial' %}selected{% endif %}>Financial</option>
                <option value="Wellbeing" {% if support_request.support_category == 'Wellbeing' %}selected{% endif %}>Wellbeing</option>
                <option value="Disability" {% if support_request.support_category == 'Disability' %}selected{% endif %}>Disability</option>
                <option value="Accommodation" {% if support_request.support_category == 'Accommodation' %}selected{% endif %}>Accommodation</option>
                <option value="Other" {% if support_request.support_category == 'Other' %}selected{% endif %}>Other</option>
            </select>
        </p>

        <p>
            <label for="support_request_description">Support Request Description</label>
            <br>
            <textarea name="support_request_description"
                      placeholder="Details of the support request"
                      rows="8"
                      cols="60"
                      required>{{ support_request.support_request_description }}</textarea>
        </p>

        <p>
            <label for="case_status">Case Status</label><br>
            <select name="case_status" required>
                <option value="New" {% if support_request.case_status == 'New' %}selected{% endif %}>New</option>
                <option value="In Progress" {% if support_request.case_status == 'In Progress' %}selected{% endif %}>In Progress</option>
                <option value="Awaiting Student" {% if support_request.case_status == 'Awaiting Student' %}selected{% endif %}>Awaiting Student</option>
                <option value="Closed" {% if support_request.case_status == 'Closed' %}selected{% endif %}>Closed</option>
            </select>
        </p>

        <p>
            <label for="internal_staff_notes">Internal Staff Notes</label>
            <br>
            <textarea name="internal_staff_notes"
                      placeholder="Staff-only notes relating to the case"
                      rows="5"
                      cols="60">{{ support_request.internal_staff_notes }}</textarea>
        </p>

        <p>
            <label for="assigned_support">Assigned Support</label><br>
            <input type="text" name="assigned_support"
                   value="{{ support_request.assigned_support }}"
                   placeholder="Staff member responsible">
        </p>

        <p>
            <button type="submit">Update Request</button>
        </p>
    </form>
{% endblock %}
